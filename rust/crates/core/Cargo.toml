[package]
name = "rekolor-core"
description = "Color matching and recoloring on raw RGBA8 buffers; no I/O, no browser or WASM dependencies"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
log = "0.4.34"
# `libm` instead of the default `std`: the float functions are then the same pure-Rust code on every
# target, so ΔE is bit-identical natively and in WASM. Enabling `palette/std` anywhere in the
# workspace would switch it back (Cargo features are additive) and break that guarantee.
palette = { version = "0.7.7", default-features = false, features = ["libm"] }
thiserror = "2.0.21"

[dev-dependencies]
png = "0.18.1"
serde_json = { version = "1.0.151", features = ["preserve_order"] }
