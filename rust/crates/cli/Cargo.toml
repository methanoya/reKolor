[package]
name = "rekolor-cli"
description = "Command-line tool for rekolor: recolor files, generate palette configs, update goldens"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "rekolor_cli"
path = "src/lib.rs"

[[bin]]
name = "rekolor"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
env_logger = "0.11.11"
log = "0.4.34"
rekolor-core = { path = "../core" }
rekolor-io = { path = "../io" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
thiserror = "2.0.21"
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
