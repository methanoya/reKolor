# The Rust workspace.
[workspace]
resolver = "3"
members = ["crates/core", "crates/config", "crates/wasm", "crates/io", "crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Metan"]
publish = false

[workspace.dependencies]
# For `rekolor-io`. All readable formats; the default "avif" feature is left out because it is
# only an AVIF encoder.
image = { version = "0.25.10", default-features = false, features = [
    "rayon",
    "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
