# The Rust workspace: several packages ("crates") built and tested together.
#
# Cargo is Rust's build tool and package manager; this file is its manifest. A workspace shares one
# `Cargo.lock` (exact dependency versions) and one `target/` folder (build output) between its
# crates. Build everything with `cargo build`, test everything with `cargo test --workspace`.
[workspace]
# Version 3 of Cargo's dependency resolver (the one that matches edition 2024).
resolver = "3"
# The crates of this workspace, each a folder with its own `Cargo.toml`:
# - core:   the color engine (pure functions on pixel buffers);
# - config: the `*.palettes.toml` file format, shared by the CLI and the web app;
# - wasm:   the WebAssembly interface the browser app calls;
# - io:     reading and writing image files (native builds only);
# - cli:    the `rekolor` command-line tool.
members = ["crates/core", "crates/config", "crates/wasm", "crates/io", "crates/cli"]

# Package settings the crates inherit with `version.workspace = true` and so on.
[workspace.package]
version = "0.2.0"
# The Rust language edition: which syntax and defaults the compiler uses.
edition = "2024"
authors = ["Metan"]
# Never upload these crates to crates.io (the public Rust package registry).
publish = false

# Dependency versions shared by several crates; a crate opts in with `image.workspace = true`.
[workspace.dependencies]
# For `rekolor-io`. All readable formats; the default "avif" feature is left out because it is
# only an AVIF encoder. `default-features = false` turns off the crate's default features, and
# `features` lists the ones to turn on: "rayon" decodes in parallel, the rest are image formats.
image = { version = "0.25.10", default-features = false, features = [
    "rayon",
    "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
