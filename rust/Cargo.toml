[package]
name = "rekolor"
version = "0.1.1"
edition = "2024"
authors = ["Timur Gamerov"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
crate-type = ["cdylib", "rlib"]


[dependencies]
# All readable formats; the default "avif" feature is left out because it is only an AVIF encoder.
image = { version = "0.25.10", default-features = false, features = [
    "rayon",
    "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2.129"
web-sys = { version = "0.3.106", features = ["console"] }
typeshare = "1.0.5"
deltae = "0.3.2"
lab = "0.11.0"
