# The Rust workspace (R1, R2).
[workspace]
resolver = "3"
members = ["crates/core", "crates/wasm", "crates/io", "crates/cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Metan"]
publish = false

[workspace.dependencies]
# For `rekolor-io` (task step 7). All readable formats; the default "avif" feature is left out
# because it is only an AVIF encoder (see "Image formats" in the decisions).
image = { version = "0.25.10", default-features = false, features = [
    "rayon",
    "bmp", "dds", "exr", "ff", "gif", "hdr", "ico", "jpeg", "png", "pnm", "qoi", "tga", "tiff", "webp",
] }
